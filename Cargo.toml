[package]
name = "gita"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fast Rust port of gita - manage multiple git repos"
readme = "README.md"

[[bin]]
name = "gita"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
csv = "1"
dirs = "6"
git2 = { version = "0.19", features = ["vendored-libgit2"] }
owo-colors = "4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util"] }
walkdir = "2"

[dev-dependencies]
serial_test = "3"
tempfile = "3"
